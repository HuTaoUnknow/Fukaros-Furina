# Linux CTest for the portable unit tests.
#
# Packages installed below:
#   build-essential, cmake, ninja-build, pkg-config, python3-pip
#   Qt 6.11.1 (Widgets, Network, Gui, Test) via aqtinstall.
#   Ubuntu 24.04 apt only has Qt 6.4, which is older than the CMake minimum (Qt 6.5).
#   Runtime libraries used by the Qt offscreen plugin: libgl1, libegl1, libglib2.0-0,
#   libxkbcommon, libxcb, libdbus, libfontconfig, libfreetype.
#
# Not installed, and not exercised by this workflow:
#   Android SDK, NDK, JDK, emulator, or APK packaging (Furina/build-android.ps1)
#   NVIDIA drivers or NVENC (headers are vendored; the encoder is Windows-only)
#   Windows IDD virtual display driver (MttVDD) and Inno Setup
#   MinGW, ADB platform-tools, or a physical tablet
name: Linux unit tests

on:
  push:
  pull_request:

jobs:
  ctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake ninja-build pkg-config python3-pip \
            libgl1-mesa-dev libegl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libx11-xcb1 libxcb-glx0

      - name: Cache Qt 6.11.1
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-6.11.1-linux-gcc_64

      - name: Install Qt 6.11.1
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --user aqtinstall
          export PATH="$HOME/.local/bin:$PATH"
          aqt install-qt linux desktop 6.11.1 linux_gcc_64 -O "${{ runner.temp }}/qt"

      - name: Configure
        env:
          QT_ROOT: ${{ runner.temp }}/qt/6.11.1/gcc_64
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
